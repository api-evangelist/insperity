apis:
  - aid: insperity:insperity-onboarding-api
    name: Insperity Onboarding API
    description: >-
      Use your own applicant tracking or HR application to send candidate hire information to
      Insperity Premier Onboarding. One published operation, POST /public/Employee/Onboarding/v2,
      which accepts a caller-owned person identifier because the person does not yet have an
      Insperity ID.
    humanURL: https://developer.insperity.com/categories/onboarding/public
    baseURL: https://api.insperity.com/public
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/insperity.png
    tags:
      - Onboarding
      - Hiring
      - Human Resources
    properties:
      - type: Documentation
        url: https://developer.insperity.com/developer-resources
      - type: APIReference
        url: https://developer.insperity.com/categories/onboarding/public
  - aid: insperity:insperity-payroll-tax-api
    name: Insperity Payroll & Tax API
    description: >-
      Update an employee's compensation and retrieve general ledger information post payroll. Three
      published operations covering billing group changes, remuneration changes and the payroll
      ledger read.
    humanURL: https://developer.insperity.com/categories/payroll_tax/public
    baseURL: https://api.insperity.com/public
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/insperity.png
    tags:
      - Payroll
      - Tax
      - Compensation
      - General Ledger
    properties:
      - type: Documentation
        url: https://developer.insperity.com/developer-resources
      - type: APIReference
        url: https://developer.insperity.com/categories/payroll_tax/public
  - aid: insperity:insperity-hris-api
    name: Insperity HRIS API
    description: >-
      Transfer employee information to and from Insperity Premier. Twenty-six published operations —
      fifteen named employee change events written as POSTs (address, email, phone, department,
      location, supervisor, job title, employment status, exemption status and more) and eleven
      company-scoped employee collection reads covering communication, company data, compensation,
      employment, position and PTO.
    humanURL: https://developer.insperity.com/categories/hris/public
    baseURL: https://api.insperity.com/public
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/insperity.png
    tags:
      - HRIS
      - Employees
      - Human Resources
      - Workforce Management
    properties:
      - type: Documentation
        url: https://developer.insperity.com/developer-resources
      - type: APIReference
        url: https://developer.insperity.com/categories/hris/public
  - aid: insperity:insperity-core-api
    name: Insperity Core API
    description: >-
      Company-scoped reference data. Some Insperity API fields require specific values as defined in
      Insperity Premier, and the Core APIs return the list of accepted options — benefit classes,
      billing groups, departments, job categories, job functions, locations, worksite locations,
      work levels, workers' comp codes, remuneration change reasons and remuneration type codes.
      Fifteen published read operations.
    humanURL: https://developer.insperity.com/categories/core/public
    baseURL: https://api.insperity.com/public
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/insperity.png
    tags:
      - Reference Data
      - Code Lists
      - Human Resources
    properties:
      - type: Documentation
        url: https://developer.insperity.com/developer-resources
      - type: APIReference
        url: https://developer.insperity.com/categories/core/public
