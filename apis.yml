name: Insperity
aid: insperity
specificationVersion: '0.23'
description: >-
  Insperity is a professional employer organization (PEO) headquartered in Kingwood, Texas that
  provides human resources and business performance solutions to small and medium-sized businesses,
  including payroll processing, employee benefits, workers' compensation, HR compliance and the
  Insperity Premier HR technology platform. Insperity Premier exposes a REST Public API at
  https://api.insperity.com/public organized into four categories — Onboarding, Payroll & Tax, HRIS
  and Core — covering 45 publicly listed operations that let a client's applicant tracking system,
  HRIS or payroll application send new-hire records, submit employee change events, retrieve
  post-payroll general ledger data, and read the company-scoped reference code lists those writes
  must resolve against. Access is not self-service: a key is issued per customer by an Insperity
  Integration Specialist after an API Terms of Use Agreement is signed, requests must originate from
  allow-listed IP addresses, and the developer portal's Swagger documents require a Premier account.
